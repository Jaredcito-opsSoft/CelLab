services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      RELEASE_VERSION: ${RELEASE_VERSION:-pilot}
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
